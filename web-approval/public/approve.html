<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approve Unlock</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0b1020;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      h1 { font-size: 18px; margin-bottom: 6px; }
      p { color: rgba(255,255,255,0.70); font-size: 13px; margin-bottom: 14px; line-height: 1.45; }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(74,144,217,0.18);
        border: 1px solid rgba(74,144,217,0.35);
        color: #b9dcff;
        margin-bottom: 12px;
      }
      label { display: block; font-size: 12px; color: rgba(255,255,255,0.7); margin: 10px 0 6px; }
      input {
        width: 100%;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(0,0,0,0.25);
        color: #fff;
        outline: none;
        font-size: 14px;
      }
      input::placeholder { color: rgba(255,255,255,0.35); }
      .row { display: flex; gap: 12px; }
      .btn {
        width: 100%;
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        border: none;
        background: #16a34a;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .msg { margin-top: 12px; font-weight: 650; font-size: 13px; }
      .ok { color: #34d399; }
      .err { color: #fb7185; }
      .muted { color: rgba(255,255,255,0.55); }
      ul { margin: 10px 0 0 18px; color: rgba(255,255,255,0.70); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Impulse Control • Trusted approval</div>
      <h1>Approve Unlock</h1>
      <p class="muted" id="subtitle">Loading…</p>

      <div id="details" style="display:none">
        <p>
          You are approving access for:
          <strong id="pkg"></strong>
        </p>
        <div id="featuresWrap" style="display:none">
          <p style="margin-bottom:6px">Blocked features:</p>
          <ul id="features"></ul>
        </div>

        <label>Your name</label>
        <input id="name" placeholder="e.g. Alex" autocomplete="name" />

        <label>Set 4-digit PIN</label>
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234" />

        <button class="btn" id="approveBtn">Approve for 1 hour</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>

    <script>
      const qs = new URLSearchParams(location.search);
      const token = qs.get("token");
      const API_BASE = location.origin;

      const subtitle = document.getElementById("subtitle");
      const details = document.getElementById("details");
      const msg = document.getElementById("msg");
      const pkgEl = document.getElementById("pkg");
      const featuresWrap = document.getElementById("featuresWrap");
      const featuresEl = document.getElementById("features");
      const nameEl = document.getElementById("name");
      const pinEl = document.getElementById("pin");
      const btn = document.getElementById("approveBtn");

      function setMsg(type, text) {
        msg.className = "msg " + (type === "ok" ? "ok" : "err");
        msg.textContent = text;
      }

      async function load() {
        if (!token) {
          subtitle.textContent = "";
          setMsg("err", "Invalid link (missing token).");
          return;
        }
        try {
          const r = await fetch(`${API_BASE}/trusted/setup/${token}`);
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Invalid or expired link.");

          subtitle.textContent = "Enter your name and set a 4-digit PIN.";
          pkgEl.textContent = data.userName || "(unknown user)";

          const features = Array.isArray(data.blockedFeatures) ? data.blockedFeatures : [];
          if (features.length) {
            featuresWrap.style.display = "";
            featuresEl.innerHTML = "";
            for (const f of features) {
              const li = document.createElement("li");
              li.textContent = f;
              featuresEl.appendChild(li);
            }
          }

          details.style.display = "";
        } catch (e) {
          subtitle.textContent = "";
          setMsg("err", e?.message || "Failed to load.");
        }
      }

      btn.addEventListener("click", async () => {
        msg.textContent = "";
        const name = (nameEl.value || "").trim();
        const pin = (pinEl.value || "").trim();
        if (!name) return setMsg("err", "Enter your name.");
        if (!/^[0-9]{4}$/.test(pin)) return setMsg("err", "PIN must be exactly 4 digits.");

        btn.disabled = true;
        try {
          const r = await fetch(`${API_BASE}/trusted/setup/${token}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              trustedName: name,
              pin,
            }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Failed to setup PIN.");

          details.style.display = "none";
          subtitle.textContent = "";
          setMsg("ok", "PIN setup complete. User can now unlock only with this PIN.");
        } catch (e) {
          setMsg("err", e?.message || "Failed to approve.");
        } finally {
          btn.disabled = false;
        }
      });

      load();
    </script>
  </body>
</html>
