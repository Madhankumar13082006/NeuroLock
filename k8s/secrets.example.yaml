apiVersion: v1
kind: Secret
metadata:
  name: neurolock-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:REPLACE_ME@postgres:5432/impulsecontrol"
  REDIS_URL: "redis://redis:6379"
  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  JWT_EXPIRES_IN: "15m"
  FIREBASE_PROJECT_ID: "your-firebase-project-id"
  FIREBASE_CLIENT_EMAIL: "firebase-adminsdk-xxxxx@your-project.iam.gserviceaccount.com"
  FIREBASE_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    PASTE_PRIVATE_KEY_LINES_HERE
    -----END PRIVATE KEY-----
  FIREBASE_ADMIN_SDK: "{}"
  FIREBASE_DATABASE_URL: ""
