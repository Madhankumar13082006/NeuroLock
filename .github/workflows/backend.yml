name: Backend CI/CD

on:
push:
branches:
- main
- version2

permissions:
contents: read
packages: write

jobs:
build-and-push:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Dependencies
    working-directory: backend
    run: npm ci

  - name: Build Application
    working-directory: backend
    run: npm run build

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build Docker Image
    run: |
      docker build \
        -t ghcr.io/${{ github.repository_owner }}/neurolock-api:latest \
        -t ghcr.io/${{ github.repository_owner }}/neurolock-api:${{ github.sha }} \
        ./backend

  - name: Push Docker Image
    run: |
      docker push ghcr.io/${{ github.repository_owner }}/neurolock-api:latest
      docker push ghcr.io/${{ github.repository_owner }}/neurolock-api:${{ github.sha }}
```
